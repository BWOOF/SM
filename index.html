        function CourseDetailedStats({ courses, studyRecords, testRecords, exerciseRecords, dateRange, isAllTime }) {
            const data = useMemo(() => {
                const sStart = isAllTime ? '0000/00/00' : getShamsiDateString(dateRange.start);
                const sEnd = isAllTime ? '9999/99/99' : getShamsiDateString(dateRange.end);
                
                return courses.map(course => {
                    const cStudy = studyRecords.filter(r => r.course === course.name && (isAllTime || (r.date >= sStart && r.date <= sEnd)));
                    const cTests = testRecords.filter(r => r.course === course.name && (isAllTime || (r.date >= sStart && r.date <= sEnd)));
                    const cExercise = exerciseRecords.filter(r => r.course === course.name && (isAllTime || (r.date >= sStart && r.date <= sEnd)));
                    
                    const totalMins = cStudy.reduce((acc, r) => acc + (r.hours * 60) + r.minutes, 0);
                    
                    const activityStats = cStudy.reduce((acc, r) => {
                        const type = r.activityType || 'سایر';
                        acc[type] = (acc[type] || 0) + (r.hours * 60 + r.minutes);
                        return acc;
                    }, {});

                    const testStats = {
                        correct: cTests.reduce((s,r) => s + (r.correct||0), 0),
                        incorrect: cTests.reduce((s,r) => s + (r.incorrect||0), 0),
                        unanswered: cTests.reduce((s,r) => s + (r.unanswered||0), 0),
                    };
                    testStats.total = testStats.correct + testStats.incorrect + testStats.unanswered;

                    const exerciseStats = {
                        count: cExercise.reduce((s,r) => s + (r.count||0), 0),
                        mins: cExercise.reduce((s,r) => s + (r.hours*60 + r.minutes), 0)
                    };

                    return {
                        id: course.id,
                        name: course.name,
                        color: course.color,
                        totalMins,
                        activityStats,
                        testStats,
                        exerciseStats,
                        hasData: totalMins > 0 || testStats.total > 0 || exerciseStats.count > 0 || exerciseStats.mins > 0
                    };
                }).filter(d => d.hasData).sort((a,b) => b.totalMins - a.totalMins);
            }, [courses, studyRecords, testRecords, exerciseRecords, dateRange, isAllTime]);

            if (data.length === 0) return <div style={{textAlign: 'center', color: 'var(--text-muted)', padding: '2rem'}}>اطلاعاتی موجود نیست.</div>;

            return (
                <div className="dashboard-grid" style={{gridTemplateColumns: 'repeat(auto-fill, minmax(320px, 1fr))'}}>
                    {data.map(item => (
                        <div key={item.id} className="card" style={{borderTop: `5px solid ${item.color}`}}>
                            <h3 style={{marginTop: 0, marginBottom: '1rem', color: item.color}}>{item.name}</h3>
                            
                            <div style={{marginBottom: '1rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: 'var(--bg-input)', padding: '8px', borderRadius: 'var(--radius-sm)'}}>
                                <span className="stat-label">ساعت مطالعه کل</span>
                                <span style={{fontWeight: 'bold', fontSize: '1.1rem'}}>{formatMinutes(item.totalMins)}</span>
                            </div>

                            {/* Activity Breakdown */}
                            <div style={{marginBottom: '1rem'}}>
                                <div style={{fontSize: '0.85rem', color: 'var(--text-secondary)', marginBottom: '5px'}}>تفکیک فعالیت‌ها:</div>
                                <div style={{display: 'flex', flexWrap: 'wrap', gap: '5px'}}>
                                    {Object.entries(item.activityStats).map(([act, mins]) => (
                                        <span key={act} className="badge neutral" style={{fontSize: '0.8rem'}}>
                                            {act}: {formatMinutes(mins)}
                                        </span>
                                    ))}
                                </div>
                            </div>

                            {/* Test Stats */}
                            <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '5px', textAlign: 'center', marginBottom: '1rem', background: 'var(--bg-hover)', padding: '10px', borderRadius: 'var(--radius-sm)'}}>
                                <div><div style={{fontSize: '0.75rem', color: 'var(--color-positive)'}}>صحیح</div><div style={{fontWeight: 'bold'}}>{item.testStats.correct}</div></div>
                                <div><div style={{fontSize: '0.75rem', color: 'var(--color-negative)'}}>غلط</div><div style={{fontWeight: 'bold'}}>{item.testStats.incorrect}</div></div>
                                <div><div style={{fontSize: '0.75rem', color: 'var(--text-muted)'}}>نزده</div><div style={{fontWeight: 'bold'}}>{item.testStats.unanswered}</div></div>
                            </div>

                            {/* Exercise Stats */}
                            {(item.exerciseStats.count > 0 || item.exerciseStats.mins > 0) && (
                                <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: '0.9rem', borderTop: '1px solid var(--border-color)', paddingTop: '8px'}}>
                                    <span style={{color: 'var(--text-secondary)'}}>تمرین تشریحی:</span>
                                    <span>{item.exerciseStats.count} سوال ({formatMinutes(item.exerciseStats.mins)})</span>
                                </div>
                            )}
                        </div>
                    ))}
                </div>
            );
        }

        function OverallStats({ courses, studyRecords, dateRange, isAllTime }) {
             const stats = useMemo(() => {
                const sStart = isAllTime ? '0000/00/00' : getShamsiDateString(dateRange.start);
                const sEnd = isAllTime ? '9999/99/99' : getShamsiDateString(dateRange.end);
                
                const filtered = studyRecords.filter(r => isAllTime || (r.date >= sStart && r.date <= sEnd));
                
                let generalMins = 0;
                let specializedMins = 0;
                const activitySums = {};

                filtered.forEach(r => {
                    const mins = r.hours * 60 + r.minutes;
                    const course = courses.find(c => c.name === r.course);
                    if (course) {
                        if (course.type === 'general') generalMins += mins;
                        else specializedMins += mins;
                    }
                    
                    const act = r.activityType || 'سایر';
                    activitySums[act] = (activitySums[act] || 0) + mins;
                });

                return { generalMins, specializedMins, activitySums };
             }, [courses, studyRecords, dateRange, isAllTime]);

             return (
                 <div className="card">
                     <h3 style={{marginTop: 0, marginBottom: '1.5rem'}}>خلاصه عملکرد کلی</h3>
                     <div className="dashboard-grid" style={{marginBottom: '1.5rem'}}>
                         <div style={{textAlign: 'center'}}>
                             <div className="stat-label">دروس تخصصی</div>
                             <div className="stat-value" style={{color: '#f97316'}}>{formatMinutes(stats.specializedMins)}</div>
                         </div>
                         <div style={{textAlign: 'center'}}>
                             <div className="stat-label">دروس عمومی</div>
                             <div className="stat-value" style={{color: '#3b82f6'}}>{formatMinutes(stats.generalMins)}</div>
                         </div>
                     </div>
                     <div style={{borderTop: '1px solid var(--border-color)', paddingTop: '1rem'}}>
                         <div style={{fontSize: '0.9rem', fontWeight: 'bold', marginBottom: '10px'}}>مجموع فعالیت‌ها:</div>
                         <div style={{display: 'flex', flexWrap: 'wrap', gap: '10px'}}>
                             {Object.entries(stats.activitySums).map(([act, mins]) => (
                                 <div key={act} style={{background: 'var(--bg-input)', padding: '5px 10px', borderRadius: '15px', border: '1px solid var(--border-color)', fontSize: '0.9rem'}}>
                                     {act}: <b>{formatMinutes(mins)}</b>
                                 </div>
                             ))}
                         </div>
                     </div>
                 </div>
             );
        }

        function StatsPage({ studyRecords, testRecords, exerciseRecords, courses, goals, isDarkMode }) {
            const [timeRange, setTimeRange] = useState('weekly');
            const [currentDate, setCurrentDate] = useState(new Date());
            const [activeTab, setActiveTab] = useState('overview');
            
            const dateRange = useMemo(() => getDateRange(currentDate, timeRange), [currentDate, timeRange]);
            const chartInstances = useRef({});
            
            const sStart = getShamsiDateString(dateRange.start);
            const sEnd = getShamsiDateString(dateRange.end);
            const filteredStudy = studyRecords.filter(r => r.date >= sStart && r.date <= sEnd);
            const filteredTests = testRecords.filter(r => r.date >= sStart && r.date <= sEnd);

            // Prepare Data for Charts
            const preparePieData = useCallback((type) => {
                const activeCourses = courses.filter(c => !c.isArchived);
                if (type === 'studyByCourse') {
                    const data = activeCourses.map(c => {
                        const mins = filteredStudy.filter(r => r.course === c.name).reduce((s, r) => s + r.hours*60 + r.minutes, 0);
                        return { label: c.name, value: mins, color: c.color };
                    }).filter(d => d.value > 0);
                    return data;
                } else if (type === 'testByCourse') {
                     const data = activeCourses.map(c => {
                        const count = filteredTests.filter(r => r.course === c.name).reduce((s, r) => s + (r.correct||0)+(r.incorrect||0)+(r.unanswered||0), 0);
                        return { label: c.name, value: count, color: c.color };
                    }).filter(d => d.value > 0);
                    return data;
                }
                return [];
            }, [courses, filteredStudy, filteredTests]);

            // Render Charts
            useEffect(() => {
                const textColor = isDarkMode ? '#f3f4f6' : '#1f2937';
                const gridColor = isDarkMode ? '#374151' : '#e5e7eb';
                
                if (activeTab === 'overview') {
                    const ctxStudy = document.getElementById('studyTrendChart');
                    const ctxTest = document.getElementById('testTrendChart');
                    
                    if (chartInstances.current.study) chartInstances.current.study.destroy();
                    if (chartInstances.current.test) chartInstances.current.test.destroy();

                    // Generate last 7 days data for overview
                    const labels = [];
                    const dataStudy = [];
                    const dataTest = [];
                    for(let i=6; i>=0; i--) {
                        const d = new Date();
                        d.setDate(d.getDate() - i);
                        const sDate = getShamsiDateString(d);
                        labels.push(sDate.split('/')[2]); // Just day
                        dataStudy.push(studyRecords.filter(r => r.date === sDate).reduce((s, r) => s + r.hours + (r.minutes/60), 0));
                        dataTest.push(testRecords.filter(r => r.date === sDate).reduce((s, r) => s + (r.correct||0) + (r.incorrect||0) + (r.unanswered||0), 0));
                    }

                    if (ctxStudy) {
                        chartInstances.current.study = new Chart(ctxStudy, {
                            type: 'line',
                            data: {
                                labels: labels,
                                datasets: [{ label: 'ساعت مطالعه (۷ روز اخیر)', data: dataStudy, borderColor: '#10A37F', tension: 0.3, fill: true, backgroundColor: 'rgba(16, 163, 127, 0.1)' }]
                            },
                            options: { 
                                responsive: true, 
                                maintainAspectRatio: false,
                                plugins: { legend: { labels: { color: textColor, font: { family: 'Vazirmatn' } } } },
                                scales: { x: { ticks: { color: textColor }, grid: { display: false } }, y: { ticks: { color: textColor }, grid: { color: gridColor } } }
                            }
                        });
                    }

                    if (ctxTest) {
                        chartInstances.current.test = new Chart(ctxTest, {
                            type: 'bar',
                            data: {
                                labels: labels,
                                datasets: [{ label: 'تعداد تست (۷ روز اخیر)', data: dataTest, backgroundColor: '#3b82f6', borderRadius: 4 }]
                            },
                            options: { 
                                responsive: true, 
                                maintainAspectRatio: false,
                                plugins: { legend: { labels: { color: textColor, font: { family: 'Vazirmatn' } } } },
                                scales: { x: { ticks: { color: textColor }, grid: { display: false } }, y: { ticks: { color: textColor }, grid: { color: gridColor } } }
                            }
                        });
                    }

                } else if (activeTab === 'trends') {
                    // Combined Chart Logic
                    const ctxCombined = document.getElementById('combinedTrendChart');
                    
                    if (ctxCombined) {
                        if (chartInstances.current.combined) chartInstances.current.combined.destroy();
                        
                        const labels = [];
                        const dataStudy = [];
                        const dataTest = [];
                        
                        if (timeRange === 'weekly') {
                            for(let i=0; i<7; i++) {
                                const d = new Date(dateRange.start);
                                d.setDate(d.getDate() + i);
                                const sDate = getShamsiDateString(d);
                                labels.push(['شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنج‌شنبه', 'جمعه'][i]);
                                dataStudy.push(studyRecords.filter(r=>r.date===sDate).reduce((s,r)=>s+r.hours+(r.minutes/60),0));
                                dataTest.push(testRecords.filter(r=>r.date===sDate).reduce((s,r)=>s+(r.correct||0)+(r.incorrect||0)+(r.unanswered||0),0));
                            }
                        } else {
                             const numDays = Math.ceil((dateRange.end - dateRange.start) / (1000*60*60*24));
                             for(let i=0; i<numDays; i++){
                                const d = new Date(dateRange.start);
                                d.setDate(d.getDate() + i);
                                const sDate = getShamsiDateString(d);
                                labels.push(sDate.split('/')[2]);
                                dataStudy.push(studyRecords.filter(r=>r.date===sDate).reduce((s,r)=>s+r.hours+(r.minutes/60),0));
                                dataTest.push(testRecords.filter(r=>r.date===sDate).reduce((s,r)=>s+(r.correct||0)+(r.incorrect||0)+(r.unanswered||0),0));
                             }
                        }

                        chartInstances.current.combined = new Chart(ctxCombined, {
                            type: 'bar',
                            data: {
                                labels: labels,
                                datasets: [
                                    {
                                        type: 'line',
                                        label: 'ساعت مطالعه',
                                        data: dataStudy,
                                        borderColor: '#3b82f6', // Blue
                                        borderWidth: 2,
                                        fill: false,
                                        yAxisID: 'y',
                                        tension: 0.3
                                    },
                                    {

        // --- UPDATED COMPONENT: Detailed Course Performance Table (Timeline Design) ---
        function CoursePerformanceTable({ studyRecords, testRecords, exerciseRecords, dateRange, courses, setStudyRecords }) {

                setExpandedRows(prev => ({ ...prev, [courseId]: !prev[courseId] }));

            const data = useMemo(() => {
                const sStart = getShamsiDateString(dateRange.start);
                const sEnd = getShamsiDateString(dateRange.end);
                
                return courses.map(course => {
                    const cStudy = studyRecords.filter(r => r.course === course.name && r.date >= sStart && r.date <= sEnd);
                    const cTests = testRecords.filter(r => r.course === course.name && r.date >= sStart && r.date <= sEnd);
                    const cExercise = exerciseRecords.filter(r => r.course === course.name && r.date >= sStart && r.date <= sEnd);
                    
                    const totalMins = cStudy.reduce((acc, r) => acc + (r.hours * 60) + r.minutes, 0);
                    const totalTests = cTests.reduce((acc, r) => acc + (r.correct||0)+(r.incorrect||0)+(r.unanswered||0), 0);
                    const totalCorrect = cTests.reduce((acc, r) => acc + (r.correct||0), 0);
                    const totalIncorrect = cTests.reduce((acc, r) => acc + (r.incorrect||0), 0);
                    const totalUnanswered = cTests.reduce((acc, r) => acc + (r.unanswered||0), 0);
                    const totalAttempted = totalCorrect + totalIncorrect;
                    const accuracy = totalAttempted > 0 ? (totalCorrect / totalAttempted) * 100 : 0;
                    
                    const activityStats = cStudy.reduce((acc, r) => {
                        const type = r.activityType || 'سایر';
                        acc[type] = (acc[type] || 0) + (r.hours * 60 + r.minutes);
                        return acc;
                    }, {});
                    
                    // Exercise stats
                    const exerciseCount = cExercise.reduce((acc, r) => acc + (r.count || 0), 0);
                    const exerciseMins = cExercise.reduce((acc, r) => acc + (r.hours * 60 + r.minutes), 0);

                    return {
                        id: course.id,
                        name: course.name,
                        type: course.type || 'specialized',
                        color: course.color,
                        totalMins,
                        totalTests,
                        totalCorrect,
                        totalIncorrect,
                        totalUnanswered,
                        accuracy,
                        activityStats,
                        exerciseCount,
                        exerciseMins,
                        rawStudy: cStudy.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))
                    };
                }).filter(item => item.totalMins > 0 || item.totalTests > 0 || item.exerciseCount > 0)
                  .sort((a, b) => b.totalMins - a.totalMins);
            }, [studyRecords, testRecords, exerciseRecords, dateRange, courses]);

            if (data.length === 0) return <p style={{textAlign: 'center', color: 'var(--text-secondary)', padding: '2rem'}}>داده‌ای برای نمایش در این بازه وجود ندارد.</p>;

                                <th>بازدهی</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            {data.map(row => (
                                <React.Fragment key={row.id}>
                                    <tr className="main-row" onClick={() => toggleRow(row.id)}>
                                        <td style={{fontWeight: 'bold', borderRight: `4px solid ${row.color}`}}>
                                            <div style={{display:'flex', flexDirection:'column'}}>
                                                <span>{row.name}</span>
                                                <span className={`course-type-tag ${row.type === 'general' ? 'tag-general' : 'tag-specialized'}`} style={{width: 'fit-content'}}>
                                                    {row.type === 'general' ? 'عمومی' : 'تخصصی'}
                                                </span>
                                            </div>
                                        </td>
                                        <td>{formatMinutes(row.totalMins)}</td>
                                        <td>{row.totalTests}</td>
                                        <td>
                                            <span className={`badge ${row.accuracy >= 70 ? 'positive' : (row.accuracy < 40 ? 'negative' : 'neutral')}`}>
                                                {row.accuracy.toFixed(0)}%
                                            </span>
                                        </td>
                                        <td style={{textAlign: 'center', color: 'var(--text-secondary)'}}>
                                            {expandedRows[row.id] ? '▲' : '▼'}
                                        </td>
                                    </tr>
                                    {expandedRows[row.id] && (
                                        <tr className="nested-row">
                                            <td colSpan="5">
                                                <div className="nested-content">
                                                    {/* Activity Breakdown Chips */}
                                                    <div style={{marginBottom: '1rem', display: 'flex', flexWrap: 'wrap', gap: '8px'}}>
                                                        <div style={{fontWeight: 'bold', fontSize: '0.9rem', color: 'var(--text-secondary)', width: '100%', marginBottom: '5px'}}>📊 خلاصه فعالیت‌ها:</div>
                                                        {Object.entries(row.activityStats).length > 0 ? Object.entries(row.activityStats).map(([type, mins]) => (
                                                            <div key={type} style={{background: 'var(--bg-hover)', border: '1px solid var(--border-color)', borderRadius: '20px', padding: '4px 10px', fontSize: '0.85rem', display: 'flex', alignItems: 'center', gap: '5px'}}>
                                                                <span style={{color: 'var(--primary-color)', fontWeight: 'bold'}}>{type}:</span>
                                                                <span>{formatMinutes(mins)}</span>

                                                    <div style={{marginBottom: '1rem', background: 'var(--bg-hover)', padding: '10px', borderRadius: 'var(--radius-sm)', border: '1px solid var(--border-color)', display: 'flex', flexWrap: 'wrap', justifyContent: 'space-around', gap: '10px'}}>
                                                        <div style={{fontWeight: 'bold', fontSize: '0.9rem', width: '100%', color: 'var(--text-secondary)', marginBottom: '5px'}}>📝 آمار تست‌ها:</div>
                                                        <div style={{textAlign: 'center'}}><div style={{fontSize: '0.8rem', color: 'var(--text-muted)'}}>کل</div><div style={{fontWeight: 'bold'}}>{row.totalTests}</div></div>
                                                        <div style={{textAlign: 'center'}}><div style={{fontSize: '0.8rem', color: 'var(--color-positive)'}}>درست</div><div style={{fontWeight: 'bold', color: 'var(--color-positive)'}}>{row.totalCorrect}</div></div>
                                                        <div style={{textAlign: 'center'}}><div style={{fontSize: '0.8rem', color: 'var(--color-negative)'}}>غلط</div><div style={{fontWeight: 'bold', color: 'var(--color-negative)'}}>{row.totalIncorrect}</div></div>
                                                        <div style={{textAlign: 'center'}}><div style={{fontSize: '0.8rem', color: 'var(--text-muted)'}}>نزده</div><div style={{fontWeight: 'bold', color: 'var(--text-muted)'}}>{row.totalUnanswered}</div></div>
                                                    </div>
                                                    
                                                    {/* Exercise Stats */}
                                                    {(row.exerciseCount > 0 || row.exerciseMins > 0) && (
                                                        <div style={{marginBottom: '1rem', background: 'var(--bg-hover)', padding: '8px 12px', borderRadius: 'var(--radius-sm)', border: '1px solid var(--border-color)', display: 'flex', alignItems: 'center', gap: '10px'}}>
                                                            <span style={{fontWeight: 'bold', color: 'var(--text-secondary)'}}>تمرین تشریحی:</span>
                                                            <span>{row.exerciseCount} سوال</span>
                                                            <span style={{color: 'var(--text-muted)'}}>|</span>
                                                            <span>{formatMinutes(row.exerciseMins)}</span>
                                                        </div>
                                                    )}

                                                    {/* Timeline View */}
                                                    <div style={{fontWeight: 'bold', marginBottom: '1rem', color: 'var(--text-primary)'}}>فعالیت‌های اخیر:</div>
                                                    {row.rawStudy.length > 0 ? (
                                                        <div style={{marginLeft: '10px'}}>
                                                            {row.rawStudy.map(rec => (
                                                                <div key={rec.id} className="timeline-item">
                                                                    <div className="timeline-date">📅 {rec.date} {rec.startTime ? `| ⏰ ${rec.startTime} - ${rec.endTime}` : ''}</div>
                                                                    <div className="timeline-card">
                                                                        <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '5px'}}>
                                                                            <span className="badge neutral">{rec.activityType}</span>
                                                                            <span style={{fontWeight: 'bold'}}>{formatMinutes(rec.hours*60 + rec.minutes)}</span>
                                                                        </div>
                                                                        <input
                                                                            type="text"
                                                                            className="note-input"
                                                                            placeholder="یادداشت..."
                                                                            defaultValue={rec.note || ''}

                                                                                const val = e.target.value;
                                                                                setStudyRecords(prev => prev.map(r => r.id === rec.id ? { ...r, note: val } : r));
                                                                            }}
                                                                            style={{
                                                                                width: '100%',
                                                                                background: 'transparent',
                                                                                border: 'none',
                                                                                borderBottom: '1px solid var(--border-color)',
                                                                                color: 'var(--text-secondary)',
                                                                                fontSize: '0.9rem',
                                                                                padding: '5px 0'
                                                                            }}
                                                                        />
                                                                    </div>
                                                                </div>

                                                        </div>
                                                    ) : (
                                                        <div style={{color: 'var(--text-muted)', fontStyle: 'italic'}}>فقط تست یا تمرین ثبت شده است.</div>
                                                    )}
                                                </div>
                                            </td>
                                        </tr>
                                    )}
                                </React.Fragment>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        }

        function ReportPage({ studyRecords, setStudyRecords, testRecords, courses, sleepRecords, entertainmentRecords, exerciseRecords }) {
            const [viewMode, setViewMode] = useState('daily');
            const [currentDate, setCurrentDate] = useState(new Date());

            const dateRange = useMemo(() => getDateRange(currentDate, viewMode), [currentDate, viewMode]);
            
            const handlePrev = () => {
                const d = new Date(currentDate);
                if (viewMode === 'daily') d.setDate(d.getDate() - 1);
                else if (viewMode === 'weekly') d.setDate(d.getDate() - 7);
                else if (viewMode === 'monthly') d.setMonth(d.getMonth() - 1);
                setCurrentDate(d);
            };

            const handleNext = () => {
                const d = new Date(currentDate);
                if (viewMode === 'daily') d.setDate(d.getDate() + 1);
                else if (viewMode === 'weekly') d.setDate(d.getDate() + 7);
                else if (viewMode === 'monthly') d.setMonth(d.getMonth() + 1);
                setCurrentDate(d);
            };

            const formatDateDisplay = () => {
                const startStr = getShamsiDateString(dateRange.start);
                const endStr = getShamsiDateString(dateRange.end);
                if (startStr === endStr) return startStr;
                return `${startStr} - ${endStr}`;
            };

            // Stats Calculation
            const currentStats = useMemo(() => calculatePeriodStatsShamsi(studyRecords, testRecords, dateRange.start, dateRange.end), [studyRecords, testRecords, dateRange]);
            
            // Previous Period for comparison
            const prevDate = new Date(currentDate);
            if(viewMode==='weekly') prevDate.setDate(prevDate.getDate()-7);
            else if(viewMode==='monthly') prevDate.setMonth(prevDate.getMonth()-1);
            else prevDate.setDate(prevDate.getDate()-1);
            const prevRange = getDateRange(prevDate, viewMode);
            const prevStats = calculatePeriodStatsShamsi(studyRecords, testRecords, prevRange.start, prevRange.end);
            
            // Calculate Differences for Comparison
            const diffMinutes = currentStats.totalMinutes - prevStats.totalMinutes;
            const diffTests = currentStats.totalTests - prevStats.totalTests;
            
            const formatDiff = (val, isTime) => {
                const sign = val > 0 ? '+' : (val < 0 ? '-' : '');
                const absVal = Math.abs(val);
                if (isTime) return `${sign}${formatMinutes(absVal)}`;
                return `${sign}${absVal}`;
            };
            
            // Calculate Detailed Study Stats (Specialized vs General)
            const sStart = getShamsiDateString(dateRange.start);
            const sEnd = getShamsiDateString(dateRange.end);

            const filteredStudy = studyRecords.filter(r => r.date >= sStart && r.date <= sEnd);
            const filteredTests = testRecords.filter(r => r.date >= sStart && r.date <= sEnd);
            
            const totalSpecializedMins = filteredStudy.filter(r => {
                const c = courses.find(course => course.name === r.course);
                return c && (c.type === 'specialized' || !c.type); // Default to specialized
            }).reduce((acc, r) => acc + r.hours * 60 + r.minutes, 0);
            
            const totalGeneralMins = filteredStudy.filter(r => {
                const c = courses.find(course => course.name === r.course);
                return c && c.type === 'general';
            }).reduce((acc, r) => acc + r.hours * 60 + r.minutes, 0);

            // Filter Sleep & Entertainment Records
            const currentSleepRecords = useMemo(() => {
                return sleepRecords.filter(r => r.date >= sStart && r.date <= sEnd).sort((a,b) => a.date.localeCompare(b.date));
            }, [sleepRecords, sStart, sEnd]);

            const currentEntertainment = useMemo(() => {
                return entertainmentRecords.filter(r => r.date >= sStart && r.date <= sEnd).sort((a,b) => a.date.localeCompare(b.date));
            }, [entertainmentRecords, sStart, sEnd]);

            // Calculate Sleep Averages
            const sleepStats = useMemo(() => {
                if (currentSleepRecords.length === 0) return { avgWake: '-', avgSleep: '-' };
                let totalWakeMins = 0;
                let totalSleepMins = 0;
                let count = 0;
                currentSleepRecords.forEach(r => {
                    if(r.wakeTime) { totalWakeMins += timeToMinutes(r.wakeTime); }
                    if(r.sleepTime) { totalSleepMins += timeToMinutes(r.sleepTime); }
                    if(r.wakeTime || r.sleepTime) count++;
                });
                return {
                    avgWake: count > 0 ? minutesToTime(totalWakeMins / count) : '-',
                    avgSleep: count > 0 ? minutesToTime(totalSleepMins / count) : '-'
                };
            }, [currentSleepRecords]);

            // Calculate Entertainment Stats
            const entStats = useMemo(() => {
                let totalMins = 0;
                const breakdown = {};
                currentEntertainment.forEach(r => {
                    const m = (r.hours || 0) * 60 + (r.minutes || 0);
                    totalMins += m;
                    breakdown[r.category] = (breakdown[r.category] || 0) + m;
                });
                const daysCount = (new Date(dateRange.end) - new Date(dateRange.start)) / (1000 * 60 * 60 * 24) + 1; // Approx
                return { totalMins, breakdown, dailyAvg: Math.round(totalMins / (viewMode === 'daily' ? 1 : (viewMode === 'weekly' ? 7 : 30))) };
            }, [currentEntertainment, viewMode]);

            return (
                <div>
                    <h1 className="page-title">گزارش عملکرد</h1>
                    
                    <div className="card" style={{marginBottom: '2rem'}}>
                        <div style={{display: 'flex', flexDirection: 'column', gap: '1rem', marginBottom: '1.5rem'}}>
                             <div className="tabs" style={{margin: 0, border: 'none', width: '100%'}}>
                                <button className={`tab-button ${viewMode === 'daily' ? 'active' : ''}`} onClick={() => setViewMode('daily')}>روزانه</button>
                                <button className={`tab-button ${viewMode === 'weekly' ? 'active' : ''}`} onClick={() => setViewMode('weekly')}>هفتگی</button>
                                <button className={`tab-button ${viewMode === 'monthly' ? 'active' : ''}`} onClick={() => setViewMode('monthly')}>ماهانه</button>
                            </div>
                            
                            <div style={{display: 'flex', justifyContent: 'center', alignItems: 'center', gap: '10px', background: 'var(--bg-input)', padding: '0.5rem', borderRadius: 'var(--radius-md)'}}>
                                <button className="btn btn-small btn-secondary" onClick={handlePrev}>← قبلی</button>
                                <div style={{fontSize: '0.9rem', fontWeight: 'bold', direction: 'ltr', minWidth: '180px', textAlign: 'center'}}>
                                    {formatDateDisplay()}
                                </div>
                                <button className="btn btn-small btn-secondary" onClick={handleNext}>بعدی →</button>
                            </div>
                        </div>

                        {/* BIG HEADER STATS - REVISED */}
                        <div className="dashboard-grid" style={{marginBottom: '1rem'}}>
                            <div style={{textAlign: 'center', padding: '1rem', background: 'var(--bg-input)', borderRadius: 'var(--radius-md)'}}>
                                <div className="stat-label" style={{marginBottom: '5px'}}>زمان مطالعه کل</div>
                                <div className="stat-value" style={{color: 'var(--primary-color)'}}>{formatMinutes(currentStats.totalMinutes)}</div>

        // --- FULL PAGE STOPWATCH COMPONENT ---
        function StopwatchPage({ courses, studyActivities, setStudyRecords, setTestRecords, showNotification }) {
            // ... (No Changes)
            const [selectedCourse, setSelectedCourse] = useState('');
            const [selectedActivity, setSelectedActivity] = useState('');
            const [isRunning, setIsRunning] = useState(false);
            const [elapsedSeconds, setElapsedSeconds] = useState(0);
            const [startTime, setStartTime] = useState(null);
            const [testCounts, setTestCounts] = useState({correct: 0, incorrect: 0, unanswered: 0});
            
            const intervalRef = useRef(null);
            const activeCourses = courses.filter(c => !c.isArchived);
            const activeActivities = studyActivities.filter(a => !a.isArchived);

            useEffect(() => {
                if (isRunning) {
                    const startTimestamp = Date.now() - (elapsedSeconds * 1000);
                    intervalRef.current = setInterval(() => {
                        setElapsedSeconds(Math.floor((Date.now() - startTimestamp) / 1000));
                    }, 1000);
                } else {
                    clearInterval(intervalRef.current);
                }
                return () => clearInterval(intervalRef.current);
            }, [isRunning]);

            const handleStart = () => {
                if (!selectedCourse) return showNotification('لطفا ابتدا درس را انتخاب کنید');
                if (!selectedActivity) return showNotification('لطفا فعالیت را انتخاب کنید');
                if (!startTime) setStartTime(new Date());
                setIsRunning(true);
            };

            const handlePause = () => setIsRunning(false);

            const handleStop = () => {
                setIsRunning(false);
                if (elapsedSeconds < 60) {
                    showNotification('زمان کمتر از ۱ دقیقه ثبت نمی‌شود');
                    setElapsedSeconds(0);
                    setStartTime(null);
                    setTestCounts({correct: 0, incorrect: 0, unanswered: 0});
                    return;
                }

                const now = new Date();
                const start = startTime || new Date();
                
                const hours = Math.floor(elapsedSeconds / 3600);
                const minutes = Math.floor((elapsedSeconds % 3600) / 60);

                setStudyRecords(prev => [...prev, {
                    course: selectedCourse,
                    activityType: selectedActivity,
                    date: getShamsiDateString(now),
                    hours, minutes,
                    startTime: formatTimeForInput(start),
                    endTime: formatTimeForInput(now),
                    note: 'ثبت خودکار با زمان‌سنج',
                    id: Date.now(),
                    timestamp: now.toISOString()
                }]);

                const totalTests = testCounts.correct + testCounts.incorrect + testCounts.unanswered;
                if (totalTests > 0) {
                    setTestRecords(prev => [...prev, {
                        course: selectedCourse,
                        date: getShamsiDateString(now),
                        correct: testCounts.correct,
                        incorrect: testCounts.incorrect,
                        unanswered: testCounts.unanswered,
                        note: 'ثبت همزمان با مطالعه (زمان‌سنج)',
                        id: Date.now() + 1,
                        timestamp: now.toISOString()
                    }]);
                    showNotification('✅ مطالعه و تست ذخیره شد');
                } else {
                    showNotification('✅ مطالعه ذخیره شد');
                }

                setElapsedSeconds(0);
                setStartTime(null);
                setTestCounts({correct: 0, incorrect: 0, unanswered: 0});
                setSelectedCourse('');
                setSelectedActivity('');
            };

            const formatTime = (totalSeconds) => {
                const h = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
                const m = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
                const s = (totalSeconds % 60).toString().padStart(2, '0');
                return `${h}:${m}:${s}`;
            };

            const incrementTest = (type) => {
                if(!isRunning && !startTime) return showNotification('ابتدا زمان‌سنج را شروع کنید');
                setTestCounts(prev => ({...prev, [type]: prev[type] + 1}));
            };

            return (
                <div className="stopwatch-page">
                    <h1 className="page-title" style={{marginBottom: '2rem'}}>زمان‌سنج مطالعه</h1>
                    
                    <div style={{display: 'flex', gap: '1rem', marginBottom: '2rem', flexWrap: 'wrap', justifyContent: 'center', width: '100%', maxWidth: '600px'}}>
                        <select 
                            value={selectedCourse} 
                            onChange={e => setSelectedCourse(e.target.value)} 
                            disabled={isRunning || startTime}
                            style={{fontSize: '1.1rem', padding: '0.8rem', flex: 1, minWidth: '150px'}}
                        >
                            <option value="">انتخاب درس...</option>
                            {activeCourses.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
                        </select>
                        <select 
                            value={selectedActivity} 
                            onChange={e => setSelectedActivity(e.target.value)} 
                            disabled={isRunning || startTime}
                            style={{fontSize: '1.1rem', padding: '0.8rem', flex: 1, minWidth: '150px'}}
                        >
                            <option value="">انتخاب فعالیت...</option>
                            {activeActivities.map(a => <option key={a.id} value={a.name}>{a.name}</option>)}
                        </select>
                    </div>

                    <div className={`timer-circle ${isRunning ? 'active' : ''}`}>
                        <div className="timer-display-huge">{formatTime(elapsedSeconds)}</div>
                    </div>

                    <div style={{display: 'flex', gap: '1rem', marginTop: '2rem', marginBottom: '3rem'}}>
                        {!isRunning ? (
                            <button className="btn" onClick={handleStart} style={{fontSize: '1.2rem', padding: '1rem 3rem', borderRadius: '50px'}}>{startTime ? 'ادامه' : 'شروع'}</button>
                        ) : (
                            <button className="btn btn-secondary" onClick={handlePause} style={{fontSize: '1.2rem', padding: '1rem 3rem', borderRadius: '50px'}}>توقف</button>
                        )}
                        {(startTime || elapsedSeconds > 0) && (
                            <button className="btn btn-danger" onClick={handleStop} style={{fontSize: '1.2rem', padding: '1rem 3rem', borderRadius: '50px'}}>پایان و ذخیره</button>
                        )}
                    </div>

                    <div className="card" style={{padding: '1.5rem', width: '100%', maxWidth: '500px'}}>
                        <h3 style={{marginTop: 0, marginBottom: '1rem', color: 'var(--text-secondary)'}}>ثبت تست همزمان</h3>
                        <div style={{display: 'flex', justifyContent: 'space-around'}}>
                            <div className="test-btn-large" onClick={() => incrementTest('correct')} style={{borderColor: 'var(--color-positive)'}}>
                                <span style={{color: 'var(--color-positive)'}}>{testCounts.correct}</span>
                                <small>صحیح</small>
                            </div>
                            <div className="test-btn-large" onClick={() => incrementTest('incorrect')} style={{borderColor: 'var(--color-negative)'}}>
                                <span style={{color: 'var(--color-negative)'}}>{testCounts.incorrect}</span>
                                <small>غلط</small>
                            </div>
                            <div className="test-btn-large" onClick={() => incrementTest('unanswered')} style={{borderColor: 'var(--text-muted)'}}>
                                <span style={{color: 'var(--text-muted)'}}>{testCounts.unanswered}</span>
                                <small>نزده</small>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function ManageStatsPage({ studyRecords, setStudyRecords, testRecords, setTestRecords, courses, studyActivities, showNotification }) {
            // ... (No Changes - but maybe add Exercise editing if user wants, currently not explicitly asked but good for stability)
            const [editingRecord, setEditingRecord] = useState(null);
            const [recordToDelete, setRecordToDelete] = useState(null);
            const [filters, setFilters] = useState({ date: '', course: '', activityType: '' });

            const handleFilterChange = (e) => {
                setFilters({ ...filters, [e.target.name]: e.target.value });
            };

            const allRecords = [
                ...studyRecords.map(r => ({ ...r, type: 'study' })),
                ...testRecords.map(r => ({ ...r, type: 'test' }))
            ].sort((a, b) => {
                const tA = new Date(a.timestamp || 0).getTime();
                const tB = new Date(b.timestamp || 0).getTime();
                return tB - tA; // Sort by timestamp descending
            });
            
            const filteredRecords = allRecords.filter(record => {
                if (filters.course && record.course !== filters.course) return false;
                if (record.type === 'study' && filters.activityType && record.activityType !== filters.activityType) return false;
                if (filters.date && !record.date.includes(filters.date)) return false;
                return true;
            });

            const handleDeleteRecord = () => {
                if (!recordToDelete) return;
                if (recordToDelete.type === 'study') setStudyRecords(studyRecords.filter(r => r.id !== recordToDelete.id));
                else setTestRecords(testRecords.filter(r => r.id !== recordToDelete.id));
                showNotification('🗑 آمار حذف شد');
                setRecordToDelete(null);
            };
            
            const handleUpdateRecord = () => {
                 if (editingRecord.type === 'study') {
                    const updatedRecords = studyRecords.map(r => r.id === editingRecord.id ? { ...editingRecord, hours: parseInt(editingRecord.hours)||0, minutes: parseInt(editingRecord.minutes)||0 } : r);
                    setStudyRecords(updatedRecords);
                } else {
                    const updatedRecords = testRecords.map(r => r.id === editingRecord.id ? { ...editingRecord, correct: parseInt(editingRecord.correct)||0, incorrect: parseInt(editingRecord.incorrect)||0, unanswered: parseInt(editingRecord.unanswered)||0 } : r);
                    setTestRecords(updatedRecords);
                }
                showNotification('ویرایش انجام شد');
                setEditingRecord(null);
            };

            return (
                <div>
                    <h1 className="page-title">مدیریت داده‌ها</h1>
                    <div className="card">
                        <div className="form-grid">
                            <input type="text" name="date" value={filters.date} onChange={handleFilterChange} placeholder="جستجو تاریخ (مثلا 1403/06)..." />
                            <select name="course" value={filters.course} onChange={handleFilterChange}>
                                <option value="">همه درس‌ها</option>
                                {courses.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
                            </select>
                        </div>
                    </div>

                    <div className="dashboard-grid" style={{gridTemplateColumns: 'repeat(auto-fill, minmax(300px, 1fr))'}}>
                        {filteredRecords.map(record => (
                            <div key={record.id} className="card" style={{marginBottom: 0, borderRight: `4px solid ${record.type === 'test' ? 'var(--chart-color-2)' : 'var(--primary-color)'}`}}>
                                <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: '0.5rem'}}>
                                    <span style={{fontWeight: 'bold'}}>{record.course}</span>
                                    <span style={{fontSize: '0.85rem', color: 'var(--text-secondary)'}}>{record.date}</span>
                                </div>
                                <div style={{marginBottom: '1rem'}}>
                                    {record.type === 'study' ? (
                                        <span>⏱ {formatMinutes(record.hours*60 + record.minutes)} <small>({record.activityType})</small></span>
                                    ) : (
                                        <span>📝 {record.correct} ص | {record.incorrect} غ | {record.unanswered} ن</span>
                                    )}
                                </div>
                                <div style={{display: 'flex', gap: '10px'}}>
                                    <button className="btn btn-small btn-secondary" onClick={() => setEditingRecord(record)}>ویرایش</button>
                                    <button className="btn btn-small btn-danger" onClick={() => setRecordToDelete(record)}>حذف</button>
                                </div>
                            </div>
                        ))}
                    </div>
                    
                    {/* Edit Modal (Enhanced) */}
                    {editingRecord && (
                        <div className="overlay show" onClick={() => setEditingRecord(null)}>
                            <div className="card" onClick={e => e.stopPropagation()} style={{width: '90%', maxWidth: '400px', margin: '2rem auto'}}>
                                <h3>ویرایش</h3>
                                <div className="form-group" style={{marginBottom: '10px'}}>
                                    <label className="stat-label">تاریخ</label>
                                    <input value={editingRecord.date} onChange={e => setEditingRecord({...editingRecord, date: e.target.value})} dir="ltr" />
                                </div>
                                <div className="form-group" style={{marginBottom: '10px'}}>
                                    <label className="stat-label">درس</label>
                                    <select value={editingRecord.course} onChange={e => setEditingRecord({...editingRecord, course: e.target.value})}>
                                        {courses.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
                                    </select>
                                </div>
                                
                                {editingRecord.type === 'study' ? (
                                    <React.Fragment>
                                        <div className="form-group" style={{marginBottom: '10px'}}>
                                            <label className="stat-label">فعالیت</label>
                                            <select value={editingRecord.activityType} onChange={e => setEditingRecord({...editingRecord, activityType: e.target.value})}>
                                                {studyActivities.map(a => <option key={a.id} value={a.name}>{a.name}</option>)}
                                            </select>
                                        </div>
                                        <div className="form-grid">
                                            <input type="number" value={editingRecord.hours} onChange={e => setEditingRecord({...editingRecord, hours: e.target.value})} placeholder="ساعت" />
                                            <input type="number" value={editingRecord.minutes} onChange={e => setEditingRecord({...editingRecord, minutes: e.target.value})} placeholder="دقیقه" />
                                        </div>
                                    </React.Fragment>
                                ) : (
                                    <div className="form-grid" style={{gridTemplateColumns: '1fr 1fr 1fr'}}>
                                        <div><label className="stat-label">صحیح</label><input type="number" value={editingRecord.correct} onChange={e => setEditingRecord({...editingRecord, correct: e.target.value})} /></div>
                                        <div><label className="stat-label">غلط</label><input type="number" value={editingRecord.incorrect} onChange={e => setEditingRecord({...editingRecord, incorrect: e.target.value})} /></div>
                                        <div><label className="stat-label">نزده</label><input type="number" value={editingRecord.unanswered} onChange={e => setEditingRecord({...editingRecord, unanswered: e.target.value})} /></div>
                                    </div>
                                )}
                                <div className="form-group" style={{marginTop: '10px'}}>
                                    <label className="stat-label">یادداشت</label>
                                    <input value={editingRecord.note || ''} onChange={e => setEditingRecord({...editingRecord, note: e.target.value})} />
                                </div>
                                <div style={{marginTop: '1rem', display: 'flex', gap: '10px'}}>
                                    <button className="btn" onClick={handleUpdateRecord}>ذخیره</button>
                                    <button className="btn btn-secondary" onClick={() => setEditingRecord(null)}>لغو</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                     {/* Delete Confirmation Modal */}
                    {recordToDelete && (
                        <div className="overlay show" onClick={() => setRecordToDelete(null)}>
                             <div className="card" onClick={e => e.stopPropagation()} style={{width: '90%', maxWidth: '350px', margin: '2rem auto', textAlign: 'center'}}>
                                <h3 style={{color: 'var(--color-negative)'}}>حذف رکورد</h3>
                                <p>آیا مطمئن هستید؟</p>
                                <div style={{marginTop: '1rem', display: 'flex', gap: '10px', justifyContent: 'center'}}>
                                    <button className="btn btn-danger" onClick={handleDeleteRecord}>بله، حذف شود</button>
                                    <button className="btn btn-secondary" onClick={() => setRecordToDelete(null)}>انصراف</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

             return (

                            <button className="btn btn-secondary" onClick={() => fileInputRef.current.click()}>انتخاب فایل</button>

                            <button className="btn btn-danger" onClick={clearAllData}>حذف همه داده‌ها</button>
                        </div>
                    </div>
                </div>
             );
        }

        function App() {
            const initialCourses = [{ id: 1, name: 'ریاضی', color: '#3b82f6', isArchived: false, type: 'specialized' }, { id: 2, name: 'فیزیک', color: '#10A37F', isArchived: false, type: 'specialized' }, { id: 3, name: 'شیمی', color: '#eab308', isArchived: false, type: 'specialized' }];
            const initialActivities = ['مطالعه درسنامه', 'حل تمرین', 'آزمون', 'تست آموزشی', 'مرور'].map((n,i)=>({id:i, name:n, isArchived:false}));

            const [isDarkMode, setIsDarkMode] = useLocalStorage('isDarkMode', window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(false);
            const [currentPage, setCurrentPage] = useState('home');
            const [courses, setCourses] = useLocalStorage('courses', initialCourses);
            const [studyRecords, setStudyRecords] = useLocalStorage('studyRecords', []);
            const [testRecords, setTestRecords] = useLocalStorage('testRecords', []);
            const [sleepRecords, setSleepRecords] = useLocalStorage('sleepRecords', []);
            const [entertainmentRecords, setEntertainmentRecords] = useLocalStorage('entertainmentRecords', []);
            const [exerciseRecords, setExerciseRecords] = useLocalStorage('exerciseRecords', []); // New
            const [studyActivities, setStudyActivities] = useLocalStorage('studyActivities', initialActivities);
            const [goals, setGoals] = useLocalStorage('goals_v2', []);
            const [notification, setNotification] = useState('');
            const [streak, setStreak] = useState(0);

            // Responsive Logic for isMobile/Tablet (breakpoint 1024px)
            const [windowWidth, setWindowWidth] = useState(window.innerWidth);
            useEffect(() => {
                const handleResize = () => setWindowWidth(window.innerWidth);
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);
            const isMobile = windowWidth < 1024;


            useEffect(() => { document.body.className = isDarkMode ? '' : 'light-mode'; }, [isDarkMode]);
            const showNotification = (msg) => { setNotification(msg); setTimeout(() => setNotification(''), 3000); };
            
            // Auto-collapse sidebar logic
            useEffect(() => {
                if (windowWidth < 1024) setIsSidebarCollapsed(false); 
            }, [windowWidth]);

            const loadDataFromJSON = (jsonString) => {
                try {
                    const data = JSON.parse(jsonString);
                    if(data.courses) setCourses(data.courses);
                    if(data.studyRecords) setStudyRecords(data.studyRecords);
                    if(data.testRecords) setTestRecords(data.testRecords);
                    if(data.goals_v2) setGoals(data.goals_v2);
                    if(data.sleepRecords) setSleepRecords(data.sleepRecords);
                    if(data.entertainmentRecords) setEntertainmentRecords(data.entertainmentRecords);
                    if(data.exerciseRecords) setExerciseRecords(data.exerciseRecords);
                    showNotification('اطلاعات بازیابی شد');
                } catch (e) { showNotification('خطا در فایل'); }
            };
            
             // Fixed Streak Logic - Improved Algorithm
            useEffect(() => {
                // 1. Collect all unique dates with activity
                const studyDates = studyRecords.map(r => r.date);
                const testDates = testRecords.map(r => r.date);
                const allActiveDates = [...new Set([...studyDates, ...testDates])];

                // If no data, streak is 0
                if (allActiveDates.length === 0) {
                    setStreak(0);
                    return;
                }

                const todayShamsi = getTodayShamsiDate();
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                const yesterdayShamsi = getShamsiDateString(yesterday);

                // 2. Check if streak is alive (activity today OR yesterday)
                const hasActivityToday = allActiveDates.includes(todayShamsi);
                const hasActivityYesterday = allActiveDates.includes(yesterdayShamsi);

                if (!hasActivityToday && !hasActivityYesterday) {
                    setStreak(0);
                    return;
                }

                // 3. Count streak backwards
                let currentStreak = 0;
                let checkDate = new Date(); // Start checking from today
                
                // If no activity today, start counting from yesterday
                if (!hasActivityToday) {
                    checkDate.setDate(checkDate.getDate() - 1); 
                }

                // Loop backwards day by day
                while (true) {
                    const dStr = getShamsiDateString(checkDate);
                    if (allActiveDates.includes(dStr)) {
                        currentStreak++;
                        checkDate.setDate(checkDate.getDate() - 1);
                    } else {
                        break; // Streak broken
                    }
                }
                setStreak(currentStreak);
            }, [studyRecords, testRecords]);

            const exportData = () => {
                const data = { courses, studyRecords, testRecords, studyActivities, goals_v2: goals, sleepRecords, entertainmentRecords, exerciseRecords };
                const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = 'backup.json'; a.click();
            };
             const importData = (e) => {
                const file = e.target.files[0];
                if(file) { const reader = new FileReader(); reader.onload = (ev) => loadDataFromJSON(ev.target.result); reader.readAsText(file); }
            };
            const clearAllData = () => {
                if(confirm('آیا مطمئن هستید؟')) { localStorage.clear(); window.location.reload(); }
            };

            // Navigation Handler to auto-close sidebar
            const handleNav = (pageId) => {
                setCurrentPage(pageId);
                if (windowWidth < 1024) {
                    document.querySelector('.sidebar').classList.remove('open');
                } else {
                    setIsSidebarCollapsed(true); // Auto collapse on desktop too per request
                }
            };

            const renderPage = () => {
                switch(currentPage) {
                    case 'home': return <HomePage studyRecords={studyRecords} testRecords={testRecords} courses={courses} streak={streak} goals={goals} />;
                    case 'record': return <RecordStatsPage courses={courses} studyRecords={studyRecords} setStudyRecords={setStudyRecords} testRecords={testRecords} setTestRecords={setTestRecords} showNotification={showNotification} studyActivities={studyActivities} sleepRecords={sleepRecords} setSleepRecords={setSleepRecords} entertainmentRecords={entertainmentRecords} setEntertainmentRecords={setEntertainmentRecords} exerciseRecords={exerciseRecords} setExerciseRecords={setExerciseRecords} />;
                    case 'stats': return <StatsPage studyRecords={studyRecords} testRecords={testRecords} exerciseRecords={exerciseRecords} courses={courses} goals={goals} isDarkMode={isDarkMode} />;
                    case 'report': return <ReportPage studyRecords={studyRecords} setStudyRecords={setStudyRecords} testRecords={testRecords} exerciseRecords={exerciseRecords} courses={courses} sleepRecords={sleepRecords} entertainmentRecords={entertainmentRecords} />;
                    case 'courses': return <CoursesPage courses={courses} setCourses={setCourses} studyActivities={studyActivities} setStudyActivities={setStudyActivities} studyRecords={studyRecords} showNotification={showNotification} />;
                    case 'goals': return <GoalsPage goals={goals} setGoals={setGoals} studyRecords={studyRecords} testRecords={testRecords} courses={courses} showNotification={showNotification} />;
                    case 'manage': return <ManageStatsPage studyRecords={studyRecords} setStudyRecords={setStudyRecords} testRecords={testRecords} setTestRecords={setTestRecords} courses={courses} studyActivities={studyActivities} showNotification={showNotification} />;
                    case 'settings': return <SettingsPage exportData={exportData} importData={importData} clearAllData={clearAllData} showNotification={showNotification} />;
                    case 'stopwatch': return <StopwatchPage courses={courses} studyActivities={studyActivities} setStudyRecords={setStudyRecords} setTestRecords={setTestRecords} showNotification={showNotification} />;
                    default: return null;
                }
            };

            return (
                <div className="app-container">
                    {notification && <div className="notification">{notification}</div>}
                    
                    {/* Header for Mobile/Tablet */}
                    <header className="mobile-header">
                        <button className="header-menu-btn" onClick={() => document.querySelector('.sidebar').classList.add('open')}>
                            <IconMenu/>
                        </button>
                        <h1 className="mobile-header-title">مدیریت مطالعه</h1>
                        <div style={{width: '24px'}}></div> {/* Spacer */}
                    </header>

                    <div className="overlay" onClick={() => document.querySelector('.sidebar').classList.remove('open')}></div>
                    
                    <aside className={`sidebar ${isSidebarCollapsed && !isMobile ? 'collapsed' : ''}`}>
                        <div className="sidebar-header">
                            <h2 className="sidebar-title">مدیریت مطالعه</h2>
                            {!isMobile && (
                                <button className="sidebar-toggle-btn" onClick={() => setIsSidebarCollapsed(!isSidebarCollapsed)}>
                                    {isSidebarCollapsed ? <IconArrowLeft/> : <IconArrowRight/>}
                                </button>
                            )}
                            {isMobile && <button style={{background:'none', border:'none', cursor:'pointer', color: 'var(--text-secondary)'}} onClick={() => document.querySelector('.sidebar').classList.remove('open')}><IconClose/></button>}
                        </div>
                        {[
                            {id:'home', label:'میز مطالعه', icon:<IconHome/>},
                            {id:'record', label:'ثبت آمار', icon:<IconRecord/>},
                            {id:'stats', label:'آمار و نمودار', icon:<IconStats/>},
                            {id:'report', label:'گزارش عملکرد', icon:<IconReport/>},
                            {id:'courses', label:'درس و فعالیت', icon:<IconCourses/>},
                            {id:'goals', label:'اهداف', icon:<IconGoals/>},
                            {id:'manage', label:'مدیریت داده‌ها', icon:<IconManage/>},
                            {id:'settings', label:'تنظیمات', icon:<IconSettings/>},
                        ].map(item => (
                            <div key={item.id} className={`sidebar-item ${currentPage === item.id ? 'active' : ''}`} title={item.label} onClick={() => handleNav(item.id)}>
                                {item.icon} <span>{item.label}</span>
                            </div>
                        ))}
                        
                        <div style={{marginTop: 'auto'}}>
                            <div className={`sidebar-item ${currentPage === 'stopwatch' ? 'active' : ''}`} title="زمان‌سنج" onClick={() => handleNav('stopwatch')}>
                                <IconClock/> <span>زمان‌سنج</span>
                            </div>
                            
                            <div className="theme-toggle-container" onClick={() => setIsDarkMode(!isDarkMode)} title={isDarkMode ? "روشن کردن" : "تاریک کردن"}>
                                <span className="theme-toggle-text">{isDarkMode ? 'حالت روز' : 'حالت شب'}</span>
                                {isDarkMode ? <IconSun/> : <IconMoon/>}
                            </div>
                        </div>
                    </aside>
                    
                    <main className={`main-content ${isSidebarCollapsed && !isMobile ? 'expanded' : ''}`}>
                        {renderPage()}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('app'));
    </script>
    
    <script>
        if ('serviceWorker' in navigator) {
            const swContent = `
                const CACHE_NAME = 'study-manager-v4';
                self.addEventListener('install', e => e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(['.', 'https://unpkg.com/react@18/umd/react.production.min.js', 'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js', 'https://unpkg.com/@babel/standalone/babel.min.js', 'https://cdn.jsdelivr.net/npm/chart.js']))));
                self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
            `;
            const blob = new Blob([swContent], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(console.log);
        }
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
